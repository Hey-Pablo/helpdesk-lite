    * { font-family: 'Inter', sans-serif; }
    .card { @apply bg-white rounded-lg shadow p-6 border border-gray-100; }
    .btn { @apply px-4 py-2 rounded-lg font-medium transition-colors; }
    .btn-primary { @apply bg-blue-600 text-white hover:bg-blue-700; }
    .btn-secondary { @apply bg-gray-100 text-gray-700 hover:bg-gray-200; }
    .input { @apply w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent; }
    .label { @apply block text-sm font-medium text-gray-700 mb-1; }
    .badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium; }
    .badge-green { @apply bg-green-100 text-green-800; }
    .badge-yellow { @apply bg-yellow-100 text-yellow-800; }
    .badge-red { @apply bg-red-100 text-red-800; }
    .badge-blue { @apply bg-blue-100 text-blue-800; }
    .badge-gray { @apply bg-gray-100 text-gray-800; }
  </style>
